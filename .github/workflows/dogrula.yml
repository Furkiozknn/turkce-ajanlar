# Her push ve PR'da:
#   1. ajan dosyalarinin frontmatter/govde dogrulamasi (arac/dogrula.js)
#   2. web arayuzunun kaynaktan yeniden uretimi ve commit'lenenle KARSILASTIRMASI
#      -> agents/ degisip web/index.html yenilenmediyse CI kirmizi.
#      (Gece kosusunda 3 ajan eklendi, arayuz 5'te kaldi; bu kontrol o
#       sinifi kalici olarak kapatir.)
#
# banner.svg bilerek kontrol DISI: uretici fontu kullanicinin makinesindeki
# kardes depodan (mcp-vet) aliyor; CI'da o dosya yok, farkli cikti verir.
name: dogrula

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  dogrula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # web-uret tarih damgasini agents/ son commit'inden alir

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Ajan dosyalari
        run: node arac/dogrula.js

      - name: Komut ve beceri dosyalari
        run: node arac/eklenti-dogrula.js

      # Sinir sozlesmesi: her ajanin verdigi sozun yetkisiyle uyusmasi.
      # dogrula.js frontmatter mekanigine bakar; bu, ajanin ne YAPMAYACAGINI
      # soyleyip soylemedigine bakar. 70/70 kapsar, API'ye cikmaz.
      - name: Ajan sinir sozlesmesi
        run: node arac/sinir-denetle.js --kati

      - name: Sinir denetcisinin kendi testi
        run: node arac/sinir-denetle-test.js

      # Yonlendirme sozlesmesi: ayni cumleyi iki ajan sahipleniyorsa
      # kullanici dogru cumleyi kurdugunda yanlis ajan kosar ve hicbir
      # dosya tek basina hatali gorunmez. Deterministik, API'ye cikmaz.
      - name: Tetikleyici ifade cakismasi
        run: node arac/tetik-cakisma.js

      - name: Cakisma denetcisinin kendi testi
        run: node arac/tetik-cakisma-test.js

      - name: Turkce bicim kancasi (birim + kanca modu)
        run: node arac/bicim-kontrol-test.js

      # Dogrulayicinin kendi testi. Bir kapi, kendisini sinayan test
      # kosmadan kapi sayilmaz: dogrula.js bozulursa 70 ajan sessizce
      # gecer. 27 senaryo, bozuk ajan dosyalari uretip cikis kodunu olcuyor.
      - name: Dogrulayicinin kendi testi
        run: node arac/dogrula-test.js

      # Araclar BASKA bir projenin altina konunca da calisiyor mu?
      # arac/ altindaki 17 CLI CommonJS; bu depoda package.json yoktu ve
      # Node modul turunu ararken agacta yukari yuruyor. Depo bir ESM
      # paketinin altina yerlestirilince araclar "require is not defined in
      # ES module scope" ile duser. 21 Eylul 2026'da ajans-os'un U15 kapisi
      # dogrula.js'i CI'da kendi calisma alaninin altina checkout edince tam
      # bu oldu; yerelde yan yana durduklari icin hic gorulmemisti.
      - name: Modul turu (ESM paketi altinda da CommonJS)
        run: node arac/modul-turu-test.js

      # Ekip kosucusunun testi. Sahte bir claude ikilisiyle calisir;
      # API'ye cikmaz, para harcamaz.
      - name: Ekip kosucusu
        run: node arac/ekip-kos-test.js

      # Yerel sunucu bozuk bir istekle (ornegin "/%E0") dusmemeli ve web/
      # disindan dosya vermemeli. web-test.js ve ekran goruntusu adimlari
      # bu sunucuya dayaniyor.
      - name: Yerel sunucu
        run: node arac/sunucu-test.js

      # banner.svg / social.svg: "N ajan" etiketi tuvalin icinde ve guncel
      # sayida mi? Etiket 70 ajanda x=1900'e (1200 genis banner) dusmustu.
      - name: Banner ve sosyal kart
        run: node arac/banner-uret-test.js

      - name: Web arayuzu guncel mi
        run: |
          node arac/web-uret.js
          if ! git diff --exit-code --quiet -- web/index.html; then
            echo "::error file=web/index.html::web/index.html bayat. Calistir: node arac/web-uret.js ve commit'le."
            git --no-pager diff --stat -- web/index.html
            exit 1
          fi
          echo "web/index.html kaynakla uyumlu."

      - name: Diger arac bicimleri guncel mi
        run: |
          node arac/disari-aktar-test.js
          if [ -n "$(git status --porcelain -- .cursor .opencode .github/agents .codex)" ]; then
            echo "::error::Uretilmis ajan kopyalari bayat. Calistir: node arac/disari-aktar.js ve commit'le."
            git status --short -- .cursor .opencode .github/agents .codex
            exit 1
          fi
          echo "Diger arac bicimleri kaynakla uyumlu."

      - name: Plugin manifestleri gecerli JSON mu
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8')); console.log('plugin.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8')); console.log('marketplace.json OK')"

  # 45 tarayici iddiasi (arama, klavye, mobil, koyu tema, konsol hatasi)
  # depoda duruyordu ama hicbir is akisi kosturmuyordu. Ayri is, cunku
  # Playwright kurulumu gerektiriyor ve ana kapiyi yavaslatmasin.
  arayuz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Playwright (chromium)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Sunucuyu baslat
        run: |
          node arac/sunucu.js 8788 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8788/ >/dev/null && break
            sleep 0.5
          done

      # web-test.js kosturulamazsa 2 doner, 0 degil - "gecti" sanilmasin.
      - name: Tarayici testleri
        run: node arac/web-test.js
