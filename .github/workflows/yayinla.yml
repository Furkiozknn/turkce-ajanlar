# web/ klasorunu GitHub Pages'e yayinlar:
#   https://furkiozknn.github.io/turkce-ajanlar/
#
# Tetikleyiciler:
#   - master'a push, yalniz web/index.html (veya bu is akisi) degistiginde.
#     Eskiden yalniz elle tetikleniyordu; 22 Eylul 2026'da 15deb5c'den bir
#     kez yayinlandi, ardindan 71. ajan (zaman-denetci) web/index.html'e
#     girdi ama canli site 70 ajanda kaldi. Kaynak degistiginde site de
#     degismeli.
#   - workflow_dispatch: elle yeniden yayin.
# Pages kaynaginin "GitHub Actions" olmasi gerekir (depo zaten boyle ayarli).
name: yayinla

on:
  push:
    branches: [master]
    paths:
      - web/index.html
      - .github/workflows/yayinla.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 16 sn
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # web-uret tarih damgasini agents/ son commit'inden alir

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Arayuz kaynakla uyumlu mu
        run: |
          node arac/web-uret.js
          if ! git diff --exit-code --quiet -- web/index.html; then
            echo "::error::web/index.html bayat; once node arac/web-uret.js calistirip commit'le."
            exit 1
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v5
